spring:
  application:
    name: reconciler
  main:
    banner-mode: off
    web-application-type: none

jms:                                         # only used with --legacyQueue (JMS browse of TB.ORDERS.AUDIT)
  provider: ${JMS_PROVIDER:artemis}
  url: ${JMS_URL:tcp://localhost:61616}
  user: ${JMS_USER:}
  password: ${JMS_PASSWORD:}
  mq:
    qmgr: ${MQ_QMGR:QM1}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:1414}
    app-name: ${MQ_APP_NAME:reconciler}

logging:
  level:
    root: WARN
    com.tailoredbrands.otd: INFO
