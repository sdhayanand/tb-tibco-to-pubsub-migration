name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  MAVEN_OPTS: -Dmaven.artifact.threads=8

jobs:
  build:
    # unit tests (surefire) + Artemis/Pub/Sub-emulator integration tests (failsafe, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  mq-integration:
    # IBM MQ developer image (~1 GB, LICENSE=accept): only on main, opt-in via RUN_MQ_IT
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUN_MQ_IT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Pre-pull IBM MQ image
        run: docker pull icr.io/ibm-messaging/mq:latest
      - run: >-
          mvn -B -ntp -pl pubsub-to-jms-bridge -am verify
          -Dit.test=IbmMqBridgeIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mq-it-reports
          path: pubsub-to-jms-bridge/target/failsafe-reports/**

  images:
    # push the three images to GHCR on main (used by docker-compose and the e2e suite in tb-platform-infra)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [jms-to-pubsub-bridge, pubsub-to-jms-bridge, reconciler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build migration-common
        run: mvn -B -ntp -DskipTests -pl migration-common install
      - name: Jib push ${{ matrix.module }}
        run: >-
          mvn -B -ntp -DskipTests -pl ${{ matrix.module }} jib:build
          -Dimage=ghcr.io/sdhayanand/tb-${{ matrix.module }}:${{ github.sha }}
          -Djib.to.tags=latest
