apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-to-jms-bridge
spec:
  replicas: 1                      # one streaming-pull subscriber keeps ordering-key order on the MQ side
  strategy:
    type: Recreate                 # never two subscribers during a rollout (ordering)
  selector:
    matchLabels:
      app.kubernetes.io/name: pubsub-to-jms-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-to-jms-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: pubsub-to-jms-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: bridge
          image: ghcr.io/sdhayanand/tb-pubsub-to-jms-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: pubsub-to-jms-bridge
          env:
            - name: JMS_URL
              valueFrom:
                secretKeyRef: { name: otd-mq, key: url }
            - name: JMS_USER
              valueFrom:
                secretKeyRef: { name: otd-mq, key: username }
            - name: JMS_PASSWORD
              valueFrom:
                secretKeyRef: { name: otd-mq, key: password }
            - name: PUBSUB_PROJECT
              value: "PROJECT_ID"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 40
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
